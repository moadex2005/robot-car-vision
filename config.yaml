# Every setting of the car vision program lives in this one file.
# Change a value, save, and start the program again.

stream:
  source: webcam            # phone, webcam or file
  phone_url: "http://192.168.165.249:8080/video"   # the address IP Webcam shows, plus /video
  phone_picture: auto       # auto = ask the phone for the smallest picture that is sharp enough (less delay);
                            # keep = never change the phone; or a size the phone offers, like 1280x720
  webcam_index: 0           # 0 is the laptop's built-in camera
  file_path: data/samples/car_clip.mp4          # a clip recorded from the car
  width: 640                # frames are shrunk to fit inside this size, keeping their shape
  height: 480               # (a wide 1920 x 1080 phone picture becomes 640 x 360)
  reconnect_seconds: 2.0    # wait this long before trying a dropped stream again
  loop_file: true           # play the clip again when it ends

detector:
  model: yolo26n.pt         # nano size: the fastest one
  models_dir: models        # weights are downloaded here on the first run
  confidence: 0.4           # higher = fewer false alarms, more misses
  image_size: 640
  device: auto              # auto, cuda or cpu
  tracker: bytetrack.yaml   # gives each object a number that follows it
  open_model: yoloe-26s-seg.pt   # finds things by a typed name ("Look for" on the page); loaded on first use
  open_confidence: 0.35     # lower finds more but also more wrong things (at 0.25 one router was "found" four times)
  open_maybe_confidence: 0.20   # a thing you looked for that scores between this and open_confidence is shown as "maybe"
  open_every_n_frames: 3    # the named search is slower, so it runs on every 3rd frame

recognizer:
  model_pack: buffalo_l     # InsightFace face detector and face encoder
  models_dir: models
  detection_size: 640
  device: auto              # auto, cuda or cpu
  match_threshold: 0.42     # cosine similarity; lower = strangers match, higher = known people missed
  every_n_frames: 5         # faces are checked on every 5th frame to keep the video fast
  min_face_pixels: 40       # ignore faces smaller than this, they are too far to trust
  photos_dir: data/people   # one folder of photos per person
  embeddings_file: data/embeddings.npz

assistant:
  provider: anthropic
  model: claude-sonnet-5-5
  effort: low               # low, medium or high; low answers fastest
  max_tokens: 16000
  notes_file: data/knowledge.md
  people_dir: data/people   # each person's about.md is also given to the assistant
  web_search: true          # look on the web when the notes do not have the answer
  web_search_max_uses: 3
  history_turns: 10         # how many earlier question-answer pairs are sent along
  seen_within_seconds: 3.0  # a person counts as "in front of the camera" this long after the last sighting
  arabic_style: standard    # with the page's Arabic switch on: standard (Modern Standard Arabic) or egyptian (everyday Egyptian Arabic)

memory:
  file: data/memory.sqlite3 # what the camera saw and when; stays on this laptop
  keep_days: 1              # sightings and their pictures older than one day are deleted
  min_seconds: 1.0          # a thing must stay in view this long to be remembered
  pictures: true            # keep a small picture of remembered objects (never of people)

lookout:
  model: "google/gemma-3-4b-it:parasail"   # a small hosted model that names what is in view (auto-discover)
  every_seconds: 10
  picture_width: 512            # the picture sent is shrunk to this width
  max_names: 6
  daily_budget_usd: 0.50        # looking stops for the day when the estimated cost reaches this
  input_price_per_million: 0.04   # the model's listed prices in dollars, used for the estimate
  output_price_per_million: 0.05
  spend_file: data/lookout.json   # today's count and estimated cost, kept across restarts

codes:
  enabled: true             # read QR codes and barcodes in the picture (on this laptop: no model, no internet)
  every_n_frames: 5         # codes are looked for on every 5th frame to keep the video fast
  max_width: 960            # a wider picture is shrunk to this width before it is searched
  hold_seconds: 1.5         # a code stays on screen this long after it was last read

voice:
  hosted: true              # offer a hosted voice and hosted listening on the page (needs HF_TOKEN in .env)
  provider: deepinfra       # the Hugging Face inference provider that serves both models below
  speech_model: "hexgrad/Kokoro-82M"   # text to speech; it speaks English, not Arabic
  speech_voice: af_heart    # a voice of that model: af_heart (American woman), bm_george (British man)
  listen_model: "openai/whisper-large-v3-turbo"   # speech to text; English and Arabic
  max_spoken_chars: 600     # one request speaks at most this many characters
  max_listen_seconds: 20    # one recorded question is at most this long
  daily_budget_usd: 0.25    # hosted speech stops for the day when the estimated cost reaches this
  speech_price_per_million_chars: 0.99   # the listed prices in dollars, used for the estimate
  listen_price_per_minute: 0.0002
  spend_file: data/voice.json   # today's count and estimated cost, kept across restarts

watch:
  max_names: 4              # watch for at most this many things at once
  again_after_seconds: 60   # the same thing is announced again only after it was away this long

phone_door:
  enabled: false            # true: the page can also be opened from a phone on the same network, behind a password
  port: 5443                # the phone opens https://<this laptop's address>:5443
  certificate_dir: data/door    # a certificate is made here on first use; the phone warns once that it does not know it
  session_hours: 12         # a phone stays signed in this long
  max_tries: 5              # this many wrong passwords from one phone, then ...
  pause_minutes: 5          # ... it must wait this long

reactions:
  greet_cooldown_seconds: 60        # greet the same person at most this often
  message_seconds: 4.0              # how long a greeting stays on screen

app:
  host: 127.0.0.1           # only this laptop can open the demo page
  port: 5000
  jpeg_quality: 80
  log_file: logs/car_vision.log
