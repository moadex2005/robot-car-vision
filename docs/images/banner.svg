<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="title desc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Robot Car Vision</title>
  <desc id="desc">Real-time computer vision: a live video in which a person, a laptop and a bottle are found and labelled.</desc>
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <clipPath id="card"><rect width="880" height="300" rx="28"/></clipPath>
    <linearGradient id="video" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e33"/><stop offset="1" stop-color="#141416"/>
    </linearGradient>
  </defs>

  <!-- the card and its soft colours -->
  <g clip-path="url(#card)">
    <rect width="880" height="300" fill="#f5f5f7"/>
    <circle cx="770" cy="30" r="150" fill="#7ab8ff" opacity="0.5" filter="url(#soft)"/>
    <circle cx="560" cy="310" r="130" fill="#c9bbff" opacity="0.4" filter="url(#soft)"/>
    <circle cx="70" cy="-30" r="120" fill="#ffd9c2" opacity="0.45" filter="url(#soft)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="299" rx="27.5" fill="none" stroke="#d2d2d7"/>

  <!-- the words -->
  <text x="48" y="80" font-size="12" font-weight="600" letter-spacing="1.6" fill="#0066cc">REAL-TIME COMPUTER VISION</text>
  <text x="46" y="134" font-size="46" font-weight="700" letter-spacing="-1.6" fill="#1d1d1f">Robot Car Vision</text>
  <text font-size="16.5" fill="#6e6e73">
    <tspan x="48" y="168">See what the camera sees. Click anything to learn</tspan>
    <tspan x="48" y="191">what it is, then ask about it out loud.</tspan>
  </text>
  <g font-size="12" font-weight="500" fill="#1d1d1f">
    <g fill="#ffffff" stroke="#d2d2d7">
      <rect x="48" y="216" width="64" height="28" rx="14"/>
      <rect x="120" y="216" width="104" height="28" rx="14"/>
      <rect x="232" y="216" width="86" height="28" rx="14"/>
      <rect x="326" y="216" width="50" height="28" rx="14"/>
      <rect x="384" y="216" width="86" height="28" rx="14"/>
    </g>
    <g text-anchor="middle">
      <text x="80" y="234.5">Detect</text>
      <text x="172" y="234.5">Find by name</text>
      <text x="275" y="234.5">Recognise</text>
      <text x="351" y="234.5">Ask</text>
      <text x="427" y="234.5">Remember</text>
    </g>
  </g>

  <!-- the live view -->
  <rect x="508" y="46" width="328" height="208" rx="20" fill="url(#video)" filter="url(#shadow)"/>
  <circle cx="790" cy="68" r="4" fill="#ff453a"/>
  <text x="800" y="72" font-size="10" font-weight="600" letter-spacing="0.8" fill="#f5f5f7">LIVE</text>
  <line x1="524" y1="212" x2="820" y2="212" stroke="#4a4a50" stroke-width="2" stroke-linecap="round"/>

  <!-- a person the camera knows -->
  <path d="M534 212 q0 -54 38 -54 q38 0 38 54 z" fill="#3a3a40" stroke="#6e6e73" stroke-width="1.5"/>
  <circle cx="572" cy="124" r="22" fill="#3a3a40" stroke="#6e6e73" stroke-width="1.5"/>
  <g fill="none" stroke="#2997ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M543 106 v-8 q0 -4 4 -4 h8"/><path d="M589 94 h8 q4 0 4 4 v8"/>
    <path d="M601 142 v8 q0 4 -4 4 h-8"/><path d="M555 154 h-8 q-4 0 -4 -4 v-8"/>
  </g>
  <rect x="546" y="68" width="52" height="18" rx="9" fill="#2997ff"/>
  <text x="572" y="81" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">Sara</text>

  <!-- an everyday object: a box and a label -->
  <rect x="644" y="156" width="68" height="44" rx="4" fill="#26262a" stroke="#a1a1a6" stroke-width="1.5"/>
  <line x1="634" y1="205" x2="722" y2="205" stroke="#a1a1a6" stroke-width="3" stroke-linecap="round"/>
  <rect x="628" y="146" width="100" height="68" rx="7" fill="none" stroke="#2997ff" stroke-width="1.6"/>
  <rect x="628" y="126" width="62" height="17" rx="5" fill="#2997ff"/>
  <text x="659" y="138.5" font-size="10.5" font-weight="600" text-anchor="middle" fill="#ffffff">laptop 2</text>

  <!-- a thing found by name: its own outline -->
  <path d="M775 156 h12 v10 q9 3 9 12 v26 q0 6 -6 6 h-18 q-6 0 -6 -6 v-26 q0 -9 9 -12 z" fill="#2f2f34" stroke="#a1a1a6" stroke-width="1.2"/>
  <path d="M771 151 h20 v12 q10 4 10 15 v30 q0 8 -9 8 h-22 q-9 0 -9 -8 v-30 q0 -11 10 -15 z" fill="none" stroke="#ffd60a" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="756" y="128" width="50" height="17" rx="5" fill="#ffd60a"/>
  <text x="781" y="140.5" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1d1d1f">bottle</text>
</svg>
